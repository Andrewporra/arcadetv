<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Arcade TV</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0b0f1e;overflow:hidden;font-family:sans-serif;color:#fff}
canvas{width:100vw;height:100vh;display:block}#ctl{display:none;position:fixed;inset:0;background:#0b0f1e;touch-action:none;user-select:none;-webkit-user-select:none}
#join{text-align:center;padding:24px}#join input{font-size:22px;padding:12px;border-radius:12px;border:0;width:70%;max-width:320px;text-align:center}
#join button{display:block;margin:18px auto;font-size:22px;font-weight:bold;padding:14px 40px;border:0;border-radius:14px;background:#ffd24d}
#pad{display:none;position:absolute;inset:0}#chip{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:6px 18px;border-radius:20px;color:#111;font-weight:bold}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);display:none;margin:-60px 0 0 -60px}
#stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.7)}
#base{position:absolute;left:0;top:0;width:50%;height:100%}
.bt{position:absolute;width:90px;height:90px;border-radius:50%;font-size:34px;font-weight:bold;color:#111;display:flex;align-items:center;justify-content:center}
#bA{right:40px;bottom:70px;background:#5ee08a}#bB{right:150px;bottom:30px;background:#ff4d6d}.bt.on{filter:brightness(1.4);transform:scale(.93)}
#ex{display:none;position:absolute;top:10px;left:10px;z-index:5;padding:9px 16px;border-radius:18px;background:rgba(255,255,255,.16);color:#fff;font-weight:bold;font-size:15px}
#rot{display:none;position:absolute;inset:0;background:#0b0f1e;align-items:center;justify-content:center;font-size:24px;text-align:center;z-index:9}
@media (orientation:portrait){#pad.live~#rot{display:flex}}
#dbtn{display:none;position:absolute;top:10px;right:10px;z-index:10;padding:9px 14px;border:0;border-radius:18px;background:rgba(255,255,255,.16);color:#fff;font-weight:bold;font-size:15px}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<div id="ctl">
<div id="join"><h1>🎮 Arcade TV</h1><p>Sala <b id="rc"></b></p>
<input id="nm" maxlength="12" placeholder="Seu nome"><button id="go">ENTRAR</button><p id="msg"></p></div>
<div id="pad"><div id="chip"></div><div id="stick"><i></i></div><div id="base"></div>
<div id="bB" class="bt">B</div><div id="bA" class="bt">A</div><div id="ex">✕ SAIR</div></div>
<div id="rot">↻ Gire o celular para o modo horizontal</div>
<button id="dbtn">🕺 DANCE</button></div>

<script type="text/plain" id="k_gh">var AirHockeyGame=(function(){
"use strict";
var RX=80,RY=80,RW=1120,RH=560,CX=640,CY=360,GH=200,PR=20,PADR=35,MAXV=1500,POST=9,
TC=["#ff4d6d","#4dabff"],TN=["Equipe Vermelha","Equipe Azul"],
players=[],pads=[],puck={x:CX,y:CY,vx:0,vy:0,last:-1},score=[0,0],target=7,solo=true,

rinkC=null,prev={},trail=[],parts=[],rings=[],winner=-1,active=false;

function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function num(v){v=Number(v);return isNaN(v)?0:v}
function tr(s,n){s=String(s);return s.length>n?s.substring(0,n-1)+".":s}
function fold(y){var lo=RY+PR,hi=RY+RH-PR,w=hi-lo,v=(y-lo)%(2*w);if(v<0)v+=2*w;return lo+(v>w?2*w-v:v)}

function spark(x,y,c,n,sp){
 var i,a,v;
 for(i=0;i<n&&parts.length<60;i++){a=Math.random()*6.2832;v=sp*(.3+Math.random()*.7);
  parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.55,max:.55,c:c,s:2+Math.random()*3})}
}
function ring(x,y,r0,r1,c,life){if(rings.length<24)rings.push({x:x,y:y,r0:r0,r1:r1,c:c,life:life,max:life})}

function buildPads(){
 var i,p,team,idx,cnt=[0,0],pd;
 pads=[];solo=players.length<=2;
 for(i=0;i<players.length;i++){
  p=players[i];team=solo?(i===0?0:1):(i<2?0:1);idx=cnt[team]++;
  pads.push({id:p.id,name:tr(p.name||("Jogador "+(i+1)),12),color:p.color||TC[team],team:team,idx:idx,
   bot:String(p.id).indexOf("bot")===0,role:"solo",x:0,y:0,px:0,py:0,vx:0,vy:0,tx:0,ty:0,r:PADR,
   smash:0,smashCd:0,block:0,blockCd:0,aiT:0,aiErr:0,pa:false,wantS:false,wantB:false,homeY:CY});
 }
 for(i=0;i<pads.length;i++){
  pd=pads[i];
  if(cnt[pd.team]>1)pd.role=pd.idx===0?"att":"def";
  pd.homeY=cnt[pd.team]>1?(pd.idx===0?RY+180:RY+RH-180):CY;
  pd.x=pd.team===0?RX+200:RX+RW-200;pd.y=pd.homeY;
  pd.px=pd.x;pd.py=pd.y;pd.tx=pd.x;pd.ty=pd.y;
 }
 target=solo?7:10;
}

function resetPuck(dir){puck.x=CX;puck.y=CY;puck.vx=0;puck.vy=0;puck.last=-1;trail=[];serveDir=dir}

function newMatch(){
 score=[0,0];over=false;winner=-1;lastScorer=-1;parts=[];rings=[];shake=0;flash=0;
 resetPuck(Math.random()<.5?1:-1);state="count";stT=3.4;
}

/* ---------------- Bots ---------------- */
function botAI(p,dt){
 var enemyX=p.team===0?RX+RW:RX,
 homeX=p.team===0?RX+(p.role==="def"?110:230):RX+RW-(p.role==="def"?110:230),
 px=puck.x,py=puck.y,sp=Math.sqrt(puck.vx*puck.vx+puck.vy*puck.vy),
 own=p.team===0?px<CX+20:px>CX-20,toward=p.team===0?puck.vx<-60:puck.vx>60,
 tx=homeX,ty=p.homeY,speed=420,i,q,best=1e9,dd,mine=true,ux,uy,len,dist,dxm,dym,tt,py2,dot,step;
 p.aiT-=dt;if(p.aiT<=0){p.aiT=.3+Math.random()*.3;p.aiErr=(Math.random()-.5)*40}
 if(state==="play"){
  for(i=0;i<pads.length;i++){q=pads[i];if(q.team!==p.team)continue;
   dd=(q.x-px)*(q.x-px)+(q.y-py)*(q.y-py);if(dd<best){best=dd;mine=(q===p)}}
  if(own&&mine){
   ux=enemyX-px;uy=CY-py;len=Math.sqrt(ux*ux+uy*uy)||1;ux/=len;uy/=len;
   dot=(p.x-px)*ux+(p.y-py)*uy;
   dist=Math.sqrt((p.x-px)*(p.x-px)+(p.y-py)*(p.y-py));
   if(dot<-12){
    tx=px+ux*40;ty=py+uy*40+p.aiErr*.3;speed=720;
    if(dist<p.r+PR+50&&p.smashCd<=0&&Math.random()<.05)p.wantS=true;
   }else{
    tx=px-ux*(p.r+PR+30);ty=py-uy*(p.r+PR+30);
    if(dist<p.r+PR+20)ty+=(p.y<py?-1:1)*60;
    speed=640;
   }
  }else{
   tt=(homeX-px)/(puck.vx||1e-3);
   if(Math.abs(puck.vx)>25&&tt>0&&tt<1.6)py2=fold(py+puck.vy*tt);else py2=py;
   ty=clamp(py2+p.aiErr*.4,RY+PR,RY+RH-PR);
   if(!own||!toward)ty=ty*.5+p.homeY*.5;
   if(toward&&sp>600&&own&&Math.abs(p.x-px)<260&&p.blockCd<=0&&Math.random()<.05)p.wantB=true;
   speed=560;
  }
 }
 dxm=tx-p.x;dym=ty-p.y;dist=Math.sqrt(dxm*dxm+dym*dym);step=speed*dt;
 if(dist>step&&dist>0){dxm*=step/dist;dym*=step/dist}
 p.tx=p.x+dxm;p.ty=p.y+dym;
}

/* ---------------- Raquetes ---------------- */
function movePads(dt,inp){
 var i,p,c,pv,k=1-Math.exp(-dt*30),kk,minX,maxX,vx,vy,sp,rt;
 for(i=0;i<pads.length;i++){
  p=pads[i];p.px=p.x;p.py=p.y;p.pa=false;p.wantS=false;p.wantB=false;
  if(p.bot){botAI(p,dt)}
  else{
   c=inp[p.id];pv=prev[p.id]||(prev[p.id]={a:0,b:0});
   if(c){
    if(typeof c.x==="number"&&typeof c.y==="number"){p.tx=c.x;p.ty=c.y}
    if(c.a&&!pv.a){p.pa=true;p.wantS=true}
    if(c.b&&!pv.b)p.wantB=true;
    pv.a=c.a?1:0;pv.b=c.b?1:0;
   }
  }
  if(state==="play"){
   if(p.wantS&&p.smashCd<=0){p.smash=.3;p.smashCd=1.9;ring(p.x,p.y,p.r,p.r+30,"#ffd24d",.3)}
   if(p.wantB&&p.blockCd<=0){p.block=1.2;p.blockCd=4.5;ring(p.x,p.y,p.r,p.r+36,"#4de1d6",.4)}
  }
  if(p.smash>0)p.smash-=dt;if(p.smash<0)p.smash=0;
  if(p.smashCd>0)p.smashCd-=dt;
  if(p.block>0)p.block-=dt;if(p.block<0)p.block=0;
  if(p.blockCd>0)p.blockCd-=dt;
  rt=PADR+(p.block>0?12:0);p.r+=(rt-p.r)*Math.min(1,dt*18);
  kk=p.bot?1:k;
  p.x+=(p.tx-p.x)*kk;p.y+=(p.ty-p.y)*kk;
  minX=p.team===0?RX+p.r:CX+p.r;maxX=p.team===0?CX-p.r:RX+RW-p.r;
  p.x=clamp(p.x,minX,maxX);p.y=clamp(p.y,RY+p.r,RY+RH-p.r);
  vx=(p.x-p.px)/dt;vy=(p.y-p.py)/dt;sp=Math.sqrt(vx*vx+vy*vy);
  if(sp>1600){vx*=1600/sp;vy*=1600/sp}
  p.vx=vx;p.vy=vy;
 }
}

/* ---------------- Física do disco ---------------- */
function wallFx(){
 var sp=Math.sqrt(puck.vx*puck.vx+puck.vy*puck.vy);
 if(sp>350)spark(puck.x,puck.y,"#cbd5e1",4,160);
}

function goal(team){
 score[team]++;lastScorer=team;state="goal";stT=1.8;flash=1;flashC=TC[team];shake=16;
 spark(puck.x<CX?RX:RX+RW,puck.y,TC[team],40,520);
 ring(puck.x<CX?RX:RX+RW,puck.y,10,120,TC[team],.6);
 if(score[team]>=target){over=true;winner=team}
 puck.vx=0;puck.vy=0;
}

function bounds(gy0,gy1){
 var top=RY+PR,bot=RY+RH-PR,inG,i,dx,dy,d,nx,ny,vn,ps=[[RX,gy0],[RX,gy1],[RX+RW,gy0],[RX+RW,gy1]];
 if(puck.y<top){puck.y=top;if(puck.vy<0){puck.vy=-puck.vy*.94;wallFx()}}
 if(puck.y>bot){puck.y=bot;if(puck.vy>0){puck.vy=-puck.vy*.94;wallFx()}}
 for(i=0;i<4;i++){
  dx=puck.x-ps[i][0];dy=puck.y-ps[i][1];d=Math.sqrt(dx*dx+dy*dy);
  if(d<PR+POST&&d>.001){
   nx=dx/d;ny=dy/d;puck.x=ps[i][0]+nx*(PR+POST);puck.y=ps[i][1]+ny*(PR+POST);
   vn=puck.vx*nx+puck.vy*ny;
   if(vn<0){puck.vx-=1.9*vn*nx;puck.vy-=1.9*vn*ny;wallFx()}
  }
 }
 inG=puck.y>gy0&&puck.y<gy1;
 if(puck.x<RX+PR){
  if(inG){if(puck.x<RX-4){goal(1);return true}}
  else{puck.x=RX+PR;if(puck.vx<0){puck.vx=-puck.vx*.94;wallFx()}}
 }
 if(puck.x>RX+RW-PR){
  if(inG){if(puck.x>RX+RW+4){goal(0);return true}}
  else{puck.x=RX+RW-PR;if(puck.vx>0){puck.vx=-puck.vx*.94;wallFx()}}
 }
 return false;
}

function padHit(p,f){
 var ax=p.px+(p.x-p.px)*f,ay=p.py+(p.y-p.py)*f,dx=puck.x-ax,dy=puck.y-ay,R=PR+p.r,d,nx,ny,vn,e,vnn,sp;
 if(dx*dx+dy*dy>=R*R)return;
 d=Math.sqrt(dx*dx+dy*dy);
 if(d<.001){dx=p.team===0?1:-1;dy=0;d=1}
 nx=dx/d;ny=dy/d;puck.x=ax+nx*(R+.5);puck.y=ay+ny*(R+.5);
 vn=(puck.vx-p.vx)*nx+(puck.vy-p.vy)*ny;
 if(vn<0){e=p.block>0?1.05:.92;puck.vx-=(1+e)*vn*nx;puck.vy-=(1+e)*vn*ny}
 vnn=puck.vx*nx+puck.vy*ny;
 if(vnn<220){puck.vx+=nx*(220-vnn);puck.vy+=ny*(220-vnn)}
 if(p.smash>0){
  puck.vx+=nx*560;puck.vy+=ny*560;p.smash=0;shake=Math.max(shake,10);
  ring(puck.x,puck.y,10,70,"#ffd24d",.35);spark(puck.x,puck.y,"#ffd24d",14,380);
 }else spark(puck.x-nx*PR,puck.y-ny*PR,p.color,4,140);
 puck.last=p.team;
 sp=Math.sqrt(puck.vx*puck.vx+puck.vy*puck.vy);
 if(sp>MAXV){puck.vx*=MAXV/sp;puck.vy*=MAXV/sp}
}

function physics(dt){
 var n=4,h=dt/n,s,i,f,sp,gy0=CY-GH/2,gy1=CY+GH/2;
 for(s=0;s<n;s++){
  puck.x+=puck.vx*h;puck.y+=puck.vy*h;
  if(bounds(gy0,gy1))return;
  for(i=0;i<pads.length;i++)padHit(pads[i],(s+1)/n);
  if(bounds(gy0,gy1))return;
 }
 f=Math.pow(.8,dt);puck.vx*=f;puck.vy*=f;
 sp=Math.sqrt(puck.vx*puck.vx+puck.vy*puck.vy);
 if(sp>MAXV){puck.vx*=MAXV/sp;puck.vy*=MAXV/sp}
 if(sp<8){puck.vx=0;puck.vy=0;puck.still=(puck.still||0)+dt;if(puck.still>3){puck.vx=(puck.x<CX?1:-1)*260;puck.vy=(Math.random()-.5)*240;puck.still=0}}else puck.still=0;
 if(sp>250){trail.push({x:puck.x,y:puck.y});if(trail.length>14)trail.shift()}
 else if(trail.length)trail.shift();
}

function fx(dt){
 var i,q,w=0;
 shake*=Math.pow(.02,dt);if(shake<.3)shake=0;
 flash=Math.max(0,flash-dt*1.6);
 for(i=0;i<parts.length;i++){q=parts[i];q.life-=dt;if(q.life>0){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;parts[w++]=q}}
 parts.length=w;w=0;
 for(i=0;i<rings.length;i++){q=rings[i];q.life-=dt;if(q.life>0)rings[w++]=q}
 rings.length=w;
}

/* ---------------- Desenho ---------------- */
function rrect(g,x,y,w,h,r){
 g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function txt(g,s,x,y,size,color,align,stroke){
 g.font="bold "+size+"px sans-serif";g.textAlign=align||"center";g.textBaseline="alphabetic";
 if(stroke){g.lineWidth=Math.max(3,size/8);g.lineJoin="round";g.strokeStyle=stroke;g.strokeText(s,x,y)}
 g.fillStyle=color;g.fillText(s,x,y);
}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,6.2832)}

function paintRink(g){
 var gy0=CY-GH/2,gy1=CY+GH/2,gr,i;
 gr=g.createRadialGradient(CX,CY,60,CX,CY,640);gr.addColorStop(0,"#16294a");gr.addColorStop(1,"#0c1730");
 g.fillStyle=gr;rrect(g,RX,RY,RW,RH,40);g.fill();
 g.fillStyle="rgba(255,77,109,.06)";g.fillRect(RX,RY,RW/2,RH);
 g.fillStyle="rgba(77,171,255,.06)";g.fillRect(CX,RY,RW/2,RH);
 g.strokeStyle="rgba(180,205,255,.28)";g.lineWidth=4;
 g.beginPath();g.moveTo(CX,RY);g.lineTo(CX,RY+RH);g.stroke();
 circ(g,CX,CY,82);g.stroke();
 g.fillStyle="rgba(180,205,255,.4)";circ(g,CX,CY,8);g.fill();
 for(i=0;i<4;i++){circ(g,RX+RW*(i%2?.78:.22),RY+RH*(i<2?.25:.75),6);g.fill()}
 g.strokeStyle="rgba(255,77,109,.35)";g.beginPath();g.arc(RX,CY,GH/2+30,-1.5708,1.5708);g.stroke();
 g.strokeStyle="rgba(77,171,255,.35)";g.beginPath();g.arc(RX+RW,CY,GH/2+30,1.5708,4.7124);g.stroke();
 g.strokeStyle="#35598f";g.lineWidth=10;rrect(g,RX,RY,RW,RH,40);g.stroke();
 /* gols */
 g.fillStyle="#05080f";g.fillRect(RX-34,gy0,34,GH);g.fillRect(RX+RW,gy0,34,GH);
 g.fillStyle="#16294a";g.fillRect(RX-4,gy0,10,GH);g.fillRect(RX+RW-6,gy0,10,GH);
 g.shadowBlur=18;g.shadowColor=TC[0];g.strokeStyle=TC[0];g.lineWidth=6;
 g.beginPath();g.moveTo(RX-34,gy0);g.lineTo(RX-34,gy1);g.stroke();
 g.shadowColor=TC[1];g.strokeStyle=TC[1];
 g.beginPath();g.moveTo(RX+RW+34,gy0);g.lineTo(RX+RW+34,gy1);g.stroke();
 g.shadowBlur=0;
 g.fillStyle="#e9eefc";
 circ(g,RX,gy0,POST);g.fill();circ(g,RX,gy1,POST);g.fill();
 circ(g,RX+RW,gy0,POST);g.fill();circ(g,RX+RW,gy1,POST);g.fill();
}

function drawPuck(g){
 var sp=Math.sqrt(puck.vx*puck.vx+puck.vy*puck.vy),k=Math.min(1,sp/1100),i,t,col=puck.last>=0?TC[puck.last]:"#ffffff";
 for(i=0;i<trail.length;i++){t=trail[i];g.globalAlpha=(i/trail.length)*.35;g.fillStyle=col;circ(g,t.x,t.y,PR*(.4+.6*i/trail.length));g.fill()}
 g.globalAlpha=1;
 if(k>.25){g.globalAlpha=.1+.25*k;g.fillStyle=col;circ(g,puck.x,puck.y,PR*1.7);g.fill();g.globalAlpha=1}
 g.fillStyle="rgba(0,0,0,.35)";circ(g,puck.x+3,puck.y+4,PR);g.fill();
 g.fillStyle="#eef2fb";circ(g,puck.x,puck.y,PR);g.fill();
 g.strokeStyle="#7c8aa8";g.lineWidth=3;g.stroke();
 g.strokeStyle=col;g.lineWidth=3;circ(g,puck.x,puck.y,PR*.55);g.stroke();
}

function drawPad(g,p){
 var bw=44,a;
 if(p.block>0){
  g.globalAlpha=.35+.25*Math.sin(tm*14);g.fillStyle="#4de1d6";circ(g,p.x,p.y,p.r+10);g.fill();g.globalAlpha=1;
  g.strokeStyle="#4de1d6";g.lineWidth=4;circ(g,p.x,p.y,p.r+8);g.stroke();
 }
 if(p.smash>0){g.strokeStyle="#ffd24d";g.lineWidth=6;circ(g,p.x,p.y,p.r+6+(.3-p.smash)*40);g.stroke()}
 g.fillStyle="rgba(0,0,0,.35)";circ(g,p.x+4,p.y+6,p.r);g.fill();
 g.fillStyle=TC[p.team];circ(g,p.x,p.y,p.r);g.fill();
 g.fillStyle=p.color;circ(g,p.x,p.y,p.r-6);g.fill();
 g.fillStyle="rgba(0,0,0,.28)";circ(g,p.x,p.y,p.r*.4);g.fill();
 g.strokeStyle="rgba(255,255,255,.7)";g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,p.r-10,3.5,4.6);g.stroke();
 a=p.bot?"#cfd6ff":"#ffffff";
 txt(g,p.name,p.x,p.y-p.r-10,15,a,"center","rgba(5,8,20,.9)");
 if(p.smashCd>0){g.fillStyle="rgba(0,0,0,.55)";g.fillRect(p.x-bw/2,p.y+p.r+8,bw,5);g.fillStyle="#ffd24d";g.fillRect(p.x-bw/2,p.y+p.r+8,bw*(1-p.smashCd/1.9),5)}
 if(p.blockCd>0){g.fillStyle="rgba(0,0,0,.55)";g.fillRect(p.x-bw/2,p.y+p.r+15,bw,5);g.fillStyle="#4de1d6";g.fillRect(p.x-bw/2,p.y+p.r+15,bw*(1-p.blockCd/4.5),5)}
}

function drawFx(g){
 var i,q,k;
 for(i=0;i<parts.length;i++){q=parts[i];g.globalAlpha=Math.max(0,q.life/q.max);g.fillStyle=q.c;g.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s)}
 for(i=0;i<rings.length;i++){q=rings[i];k=1-q.life/q.max;g.globalAlpha=1-k;g.strokeStyle=q.c;g.lineWidth=4;circ(g,q.x,q.y,q.r0+(q.r1-q.r0)*k);g.stroke()}
 g.globalAlpha=1;
}

function teamNames(t){
 var i,r=[];for(i=0;i<pads.length;i++)if(pads[i].team===t)r.push(pads[i]);return r;
}

function drawHud(g){
 var t,i,l,x,y;
 g.fillStyle="rgba(0,0,0,.55)";rrect(g,520,12,240,66,16);g.fill();
 g.fillStyle=TC[0];g.fillRect(520,12,8,66);g.fillStyle=TC[1];g.fillRect(752,12,8,66);
 txt(g,String(score[0]),585,58,46,TC[0],"center");
 txt(g,"-",640,54,36,"#9aa4d0","center");
 txt(g,String(score[1]),695,58,46,TC[1],"center");
 txt(g,(solo?"1x1":"2x2")+" · primeiro a "+target,640,73,12,"#9aa4d0","center");
 for(t=0;t<2;t++){
  l=teamNames(t);
  if(!solo)txt(g,TN[t].toUpperCase(),t?1196:84,24,13,TC[t],t?"right":"left");
  for(i=0;i<l.length;i++){
   y=(solo?36:44)+i*22;
   if(t){x=1196;g.fillStyle=l[i].color;g.fillRect(x+6,y-14,6,16);txt(g,l[i].name,x,y,19,"#ffffff","right")}
   else{x=84;g.fillStyle=l[i].color;g.fillRect(x-12,y-14,6,16);txt(g,l[i].name,x,y,19,"#ffffff","left")}
  }
 }
 if(state==="play"||state==="count")txt(g,"Joystick: mover  ·  A: SMASH (golpe forte)  ·  B: ESCUDO (raquete maior)",CX,672,18,"#9aa4d0","center");
}

function drawOverlays(g){
 var n,w,i,l,k;
 if(flash>0){g.globalAlpha=flash*.28;g.fillStyle=flashC;g.fillRect(0,0,1280,720);g.globalAlpha=1}
 if(state==="count"){
  n=Math.ceil(stT);if(n>3)n=3;
  k=stT-Math.floor(stT);
  g.globalAlpha=.4+.6*k;
  txt(g,String(n),CX,CY+50,150,"#ffd24d","center","rgba(5,8,20,.8)");
  g.globalAlpha=1;
  if(score[0]+score[1]===0)txt(g,"Prepare-se!  Primeiro a "+target+" gols vence",CX,CY-100,30,"#ffffff","center","rgba(5,8,20,.8)");
  else txt(g,"Prepare-se!",CX,CY-100,30,"#ffffff","center","rgba(5,8,20,.8)");
 }
 if(state==="goal"&&!over){
  w=1+.08*Math.sin(tm*18);
  g.save();g.translate(CX,CY);g.scale(w,w);
  txt(g,"GOL!",0,20,130,TC[lastScorer],"center","rgba(5,8,20,.85)");
  g.restore();
 }
 if(state==="goal"&&over){
  txt(g,"GOL!",CX,CY+20,130,TC[lastScorer],"center","rgba(5,8,20,.85)");
 }
 if(state==="over"){
  g.fillStyle="rgba(5,8,20,.82)";g.fillRect(0,0,1280,720);
  txt(g,"VITÓRIA!",CX,190,96,"#ffd24d","center","rgba(5,8,20,.9)");
  l=teamNames(winner);
  txt(g,solo&&l[0]?l[0].name:TN[winner],CX,270,54,TC[winner],"center");
  if(!solo){
   w=[];for(i=0;i<l.length;i++)w.push(l[i].name);
   txt(g,w.join("  ·  "),CX,318,28,"#ffffff","center");
  }
  txt(g,score[0]+"  x  "+score[1],CX,420,84,"#ffffff","center","rgba(5,8,20,.9)");
  if(stT>1.5&&Math.floor(tm*2)%2===0)txt(g,"Pressione A para jogar novamente",CX,540,32,"#80d8ff","center");
 }
}

return{
 init:function(cv,pl){
  var i,p;
  players=[];prev={};
  if(pl&&pl.length)for(i=0;i<pl.length&&players.length<4;i++){
   p=pl[i];if(p&&p.id!==undefined&&p.id!==null)players.push({id:p.id,name:p.name?String(p.name):"Jogador "+(players.length+1),color:p.color?String(p.color):TC[players.length%2]});
  }
  rinkC=null;
  try{rinkC=document.createElement("canvas");rinkC.width=1280;rinkC.height=720;paintRink(rinkC.getContext("2d"))}catch(e){rinkC=null}
  tm=0;buildPads();newMatch();active=true;
 },
 update:function(dt,inp){
  var i;
  if(!active)return;
  inp=inp||{};dt=num(dt);if(dt<=0)return;if(dt>.05)dt=.05;
  tm+=dt;
  movePads(dt,inp);
  fx(dt);
  if(state==="count"){
   stT-=dt;
   if(stT<=0){state="play";puck.vx=serveDir*300;puck.vy=(Math.random()-.5)*220}
  }else if(state==="play"){
   physics(dt);
  }else if(state==="goal"){
   stT-=dt;
   if(stT<=0){
    if(over){state="over";stT=0}
    else{state="count";stT=2.4;resetPuck(lastScorer===0?1:-1)}
   }
  }else if(state==="over"){
   stT+=dt;
   if(stT>1.5)for(i=0;i<pads.length;i++)if(!pads[i].bot&&pads[i].pa){newMatch();break}
  }
 },
 render:function(g){
  var i;
  if(!active||!g)return;
  g.fillStyle="#070b16";g.fillRect(0,0,1280,720);
  g.save();
  if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(rinkC)g.drawImage(rinkC,0,0);else paintRink(g);
  if(state!=="over"||true){
   if(state!=="goal"||!over||stT>0)drawPuck(g);
   for(i=0;i<pads.length;i++)drawPad(g,pads[i]);
  }
  drawFx(g);
  g.restore();
  drawHud(g);
  drawOverlays(g);
 },
 destroy:function(){rinkC=null;players=[];pads=[];parts=[];rings=[];trail=[];prev={};active=false}
};
})();</script>

          water: [ { x: 760, y: 360, w: 200, h: 250 } ] },

        { name: "A Ponte", par: 3,
          tee: { x: 230, y: 380 }, hole: { x: 1040, y: 380, radius: 18 },
          water: [ { x: 520, y: 130, w: 240, h: 200 }, { x: 520, y: 430, w: 240, h: 180 } ],
          sand: [ { x: 860, y: 330, w: 90, h: 100 } ] },

        { name: "Pinball", par: 3,
          tee: { x: 230, y: 370 }, hole: { x: 1050, y: 370, radius: 18 },
          bumpers: [ { x: 400, y: 370, r: 24 }, { x: 560, y: 260, r: 30 }, { x: 560, y: 480, r: 30 },
                     { x: 760, y: 370, r: 36 }, { x: 900, y: 250, r: 26 }, { x: 900, y: 490, r: 26 } ] },

        { name: "Zigue-Zague", par: 4,
          tee: { x: 240, y: 370 }, hole: { x: 1040, y: 540, radius: 18 },
          walls: [ { x: 380, y: 130, w: 24, h: 340 }, { x: 620, y: 270, w: 24, h: 340 }, { x: 860, y: 130, w: 24, h: 340 } ],
          sand: [ { x: 700, y: 160, w: 110, h: 90 } ],
          water: [ { x: 430, y: 560, w: 150, h: 50 } ] },

        { name: "Moinhos", par: 3,
          tee: { x: 230, y: 370 }, hole: { x: 1040, y: 370, radius: 18 },
          movers: [ { x: 500, y: 270, w: 24, h: 200, axis: "y", amp: 140, sp: 1.3, ph: 0 },
                    { x: 780, y: 270, w: 24, h: 200, axis: "y", amp: 140, sp: 1.3, ph: 3.14 } ] },

        { name: "Portais", par: 3,
          tee: { x: 230, y: 370 }, hole: { x: 1040, y: 370, radius: 18 },
          walls: [ { x: 630, y: 130, w: 24, h: 480 } ],
          portals: [ { a: { x: 480, y: 250 }, b: { x: 810, y: 490 }, c: "#c471ed" },
                     { a: { x: 480, y: 490 }, b: { x: 810, y: 250 }, c: "#12c2e9" } ] },

        { name: "Grande Final", par: 5,
          tee: { x: 230, y: 550 }, hole: { x: 1050, y: 200, radius: 18 },
          walls: [ { x: 310, y: 130, w: 24, h: 330 }, { x: 520, y: 290, w: 24, h: 320 }, { x: 780, y: 130, w: 24, h: 230 } ],
          sand: [ { x: 340, y: 500, w: 150, h: 110 } ],
          water: [ { x: 570, y: 130, w: 170, h: 110 } ],
          bumpers: [ { x: 660, y: 470, r: 30 } ],
          boosts: [ { x: 570, y: 300, w: 180, h: 60, dx: 1, dy: 0 } ],
          movers: [ { x: 930, y: 250, w: 24, h: 150, axis: "y", amp: 110, sp: 1.6, ph: 0 } ] }
    ],

    /* ------------------------------------------------------------ */
    /* Inicialização                                                */
    /* ------------------------------------------------------------ */

    init: function(canvas, players, config) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.config = config || {};

        if (this.canvas.width !== this.WIDTH) {
            this.canvas.width = this.WIDTH;
        }
        if (this.canvas.height !== this.HEIGHT) {
            this.canvas.height = this.HEIGHT;
        }

        this.TOTAL_HOLES = this.holesData.length;
        this.time = 0;
        this._setupPlayers(players);
        this.resetMatch();
    },

    _setupPlayers: function(players) {
        this.playersList = [];
        this.prevInputs = {};

        if (!players || !players.length) {
            return;
        }

        var count = players.length;
        if (count > this.MAX_PLAYERS) {
            count = this.MAX_PLAYERS;
        }

        for (var i = 0; i < count; i++) {
            var p = players[i];
            this.playersList.push({
                id: p.id,
                name: p.name || ("Jogador " + (i + 1)),
                color: p.color || "#ffffff",
                isBot: String(p.id).indexOf("bot") === 0,
                real: true,
                x: 0, y: 0, vx: 0, vy: 0,
                lastSafeX: 0, lastSafeY: 0,
                pin: -1,
                angle: 0,
                power: 0,
                powerDir: 1,
                isCharging: false,
                isMoving: false,
                inHole: false,
                failed: false,
                holeStrokes: 0,
                totalStrokes: 0,
                scores: [],
                fails: [],
                bot: null
            });

            this.prevInputs[p.id] = { x: 0, y: 0, a: 0, b: 0 };
        }
    },

    resetMatch: function() {
        this.currentHole = 0;
        this.state = "START";
        this.stateTimer = 0;
        this.current = null;
        this.phase = "AIM";
        this.msgTimer = 0;

        for (var i = 0; i < this.playersList.length; i++) {
            var p = this.playersList[i];
            p.totalStrokes = 0;
            p.holeStrokes = 0;
            p.scores = [];
            p.fails = [];
            p.inHole = false;
            p.failed = false;
            p.isCharging = false;
            p.isMoving = false;
            p.power = 0;
            p.bot = null;
        }
    },

    /**
     * Carrega a pista e posiciona todos os jogadores no tee
     */
    loadHole: function(holeIndex) {
        this.currentHole = holeIndex;
        var d = this.holesData[holeIndex];
        var b = d.bounds || { x: 160, y: 130, w: 960, h: 480 };

        var walls = [
            { x: b.x - 40, y: b.y - 40, w: b.w + 80, h: 40 },
            { x: b.x - 40, y: b.y + b.h, w: b.w + 80, h: 40 },
            { x: b.x - 40, y: b.y, w: 40, h: b.h },
            { x: b.x + b.w, y: b.y, w: 40, h: b.h }
        ];
        var inner = d.walls || [];
        for (var w = 0; w < inner.length; w++) {
            walls.push(inner[w]);
        }

        var bumpers = [];
        var src = d.bumpers || [];
        for (var k = 0; k < src.length; k++) {
            bumpers.push({ x: src[k].x, y: src[k].y, r: src[k].r, flash: 0 });
        }

        this.cur = {
            name: d.name,
            par: d.par,
            bounds: b,
            tee: d.tee,
            hole: d.hole,
            innerWalls: inner,
            walls: walls,
            sand: d.sand || [],
            water: d.water || [],
            bumpers: bumpers,
            boosts: d.boosts || [],
            movers: d.movers || [],
            portals: d.portals || []
        };

        // Ordem: 1º buraco = ordem de entrada; depois, quem tem menos tacadas joga primeiro
        this.order = this.playersList.slice();
        if (holeIndex > 0) {
            this.order.sort(function(a, b2) {
                if (a.totalStrokes !== b2.totalStrokes) {
                    return a.totalStrokes - b2.totalStrokes;
                }
                return 0;
            });
        }

        var baseAngle = Math.atan2(d.hole.y - d.tee.y, d.hole.x - d.tee.x);
        for (var i = 0; i < this.playersList.length; i++) {
            var p = this.playersList[i];
            p.x = d.tee.x + ((i % 4) - 1.5) * 12;
            p.y = d.tee.y + (i < 4 ? -8 : 8);
            p.vx = 0;
            p.vy = 0;
            p.lastSafeX = p.x;
            p.lastSafeY = p.y;
            p.pin = -1;
            p.angle = baseAngle;
            p.power = 0;
            p.isCharging = false;
            p.isMoving = false;
            p.inHole = false;
            p.failed = false;
            p.holeStrokes = 0;
            p.bot = null;
        }

        this.turnIdx = this.order.length - 1;
        this.current = null;
        this.phase = "AIM";
        this.msgTimer = 0;
    },

    /* ------------------------------------------------------------ */
    /* Loop principal                                               */
    /* ------------------------------------------------------------ */

    update: function(delta, inputs) {
        if (!inputs) {
            inputs = {};
        }

        var dt = delta;
        if (dt > 0.1) {
            dt = 0.1;
        }
        if (!(dt > 0)) {
            dt = 0;
        }

        this.time += dt;

        if (this.cur) {
            for (var i = 0; i < this.cur.bumpers.length; i++) {
                var bp = this.cur.bumpers[i];
                if (bp.flash > 0) {
                    bp.flash -= dt;
                }
            }
        }

        if (this.state === "START") {
            this._updateStart(dt, inputs);
        } else if (this.state === "HOLE_INTRO") {
            this._updateHoleIntro(dt, inputs);
        } else if (this.state === "PLAYING") {
            this._updatePlaying(dt, inputs);
        } else if (this.state === "HOLE_SUMMARY") {
            this._updateHoleSummary(dt, inputs);
        } else if (this.state === "GAME_OVER") {
            this._updateGameOver(dt, inputs);
        }

        this._savePreviousInputs(inputs);
    },

    _updateStart: function(dt, inputs) {
        if (this._anyButtonAPressed(inputs)) {
            this._enterHole(0);
        }
    },

    _enterHole: function(idx) {
        this.loadHole(idx);
        this.state = "HOLE_INTRO";
        this.stateTimer = 2.6;
    },

    _updateHoleIntro: function(dt, inputs) {
        this.stateTimer -= dt;
        if (this.stateTimer <= 0 || this._anyButtonAPressed(inputs)) {
            this.state = "PLAYING";
            this._nextTurn();
        }
    },

    _updatePlaying: function(dt, inputs) {
        if (this.msgTimer > 0) {
            this.msgTimer -= dt;
        }

        if (!this.current) {
            this._nextTurn();
            if (!this.current) {
                return;
            }
        }

        var p = this.current;

        if (this.phase === "AIM") {
            if (p.isBot) {
                this._updateBot(p, dt);
            } else {
                this._updateAim(p, inputs[p.id] || {}, dt);
            }
        } else if (this.phase === "ROLL") {
            this._updateRoll(p, dt);
        } else if (this.phase === "PAUSE") {
            this.phaseTimer -= dt;
            if (this.phaseTimer <= 0) {
                this._nextTurn();
            }
        }
    },

    /* ------------------------------------------------------------ */
    /* Turnos                                                       */
    /* ------------------------------------------------------------ */

    _nextTurn: function() {
        var n = this.order.length;
        for (var i = 1; i <= n; i++) {
            var idx = (this.turnIdx + i) % n;
            var cand = this.order[idx];
            if (!cand.inHole) {
                this.turnIdx = idx;
                this.current = cand;
                this.phase = "AIM";
                this.idle = 0;
                cand.isCharging = false;
                cand.power = 0;
                cand.bot = null;
                return true;
            }
        }
        this.current = null;
        this._endHole();
        return false;
    },

    _endHole: function() {
        for (var i = 0; i < this.playersList.length; i++) {
            var p = this.playersList[i];
            p.scores[this.currentHole] = p.holeStrokes;
            p.fails[this.currentHole] = p.failed;
            p.totalStrokes += p.holeStrokes;
            p.isCharging = false;
            p.power = 0;
        }
        this.state = "HOLE_SUMMARY";
        this.stateTimer = 7;
    },

    _afterShot: function(p, status) {
        // Limite de tacadas por buraco
        if (!p.inHole && p.holeStrokes >= this.MAX_STROKES) {
            p.holeStrokes = this.MAX_STROKES;
            p.inHole = true;
            p.failed = true;
            this._say("Limite de tacadas!", p.color);
        }
        this.phase = "PAUSE";
        this.phaseTimer = (status === 2) ? 1.3 : (status === 1 ? 1.0 : 0.45);
    },

    _say: function(text, color) {
        this.msg = text;
        this.msgColor = color || "#ffffff";
        this.msgTimer = 1.6;
    },

    /* ------------------------------------------------------------ */
    /* Jogador humano: mira e força                                 */
    /* ------------------------------------------------------------ */

    _updateAim: function(p, curr, dt) {
        var prev = this.prevInputs[p.id] || { a: 0, b: 0 };
        var ix = curr.x || 0;
        var iy = curr.y || 0;
        var active = false;

        if (ix * ix + iy * iy > 0.0625) {
            p.angle = Math.atan2(iy, ix);
            active = true;
        }
        if (curr.a === 1 || curr.b === 1) {
            active = true;
        }

        if (!p.isCharging) {
            if (curr.a === 1 && prev.a === 0 && curr.b !== 1) {
                p.isCharging = true;
                p.power = 0;
                p.powerDir = 1;
            }
        } else if (curr.b === 1) {
            // Cancela a tacada
            p.isCharging = false;
            p.power = 0;
        } else if (curr.a === 1) {
            p.power += p.powerDir * 90 * dt;
            if (p.power >= 100) {
                p.power = 100;
                p.powerDir = -1;
            } else if (p.power <= 0) {
                p.power = 0;
                p.powerDir = 1;
            }
        } else {
            // Soltou A: tacada (força muito baixa = cancela)
            if (p.power >= 4) {
                this._shoot(p, p.angle, p.power);
            } else {
                p.isCharging = false;
                p.power = 0;
            }
        }

        if (active) {
            this.idle = 0;
        } else {
            this.idle += dt;
            if (this.idle >= this.TURN_IDLE) {
                // Jogador ausente: tacada automática moderada
                this._shoot(p, p.angle, 50);
            }
        }
    },

    _shoot: function(p, angle, power) {
        var force = (power / 100) * this.MAX_SPEED;
        p.angle = angle;
        p.vx = Math.cos(angle) * force;
        p.vy = Math.sin(angle) * force;
        p.lastSafeX = p.x;
        p.lastSafeY = p.y;
        p.pin = -1;
        p.isCharging = false;
        p.power = 0;
        p.isMoving = true;
        p.holeStrokes++;
        this.phase = "ROLL";
    },

    _updateRoll: function(p, dt) {
        var st = this._stepBall(p, dt * 60, this.time, this.cur.hole);

        if (st === 0) {
            return;
        }

        p.vx = 0;
        p.vy = 0;
        p.isMoving = false;

        if (st === 1) {
            // Água: volta para onde tacou, com 1 tacada de penalidade
            p.x = p.lastSafeX;
            p.y = p.lastSafeY;
            p.holeStrokes++;
            this._say("Na água! +1 tacada", "#4fc3f7");
        } else if (st === 2) {
            p.inHole = true;
            var label = this._scoreLabel(p.holeStrokes, this.cur.par, false);
            this._say(p.name + ": " + label + "!", p.color);
        }

        this._afterShot(p, st);
    },

    /* ------------------------------------------------------------ */
    /* Física (usada pelo jogo e pela simulação dos bots)           */
    /* ------------------------------------------------------------ */

    _rectAt: function(m, t) {
        var off = m.amp * Math.sin(t * m.sp + m.ph);
        if (m.axis === "x") {
            return { x: m.x + off, y: m.y, w: m.w, h: m.h };
        }
        return { x: m.x, y: m.y + off, w: m.w, h: m.h };
    },

    _inRect: function(x, y, rects) {
        for (var i = 0; i < rects.length; i++) {
            var r = rects[i];
            if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) {
                return true;
            }
        }
        return false;
    },

    _collideRect: function(b, r, e) {
        var R = this.BALL_R;
        var cx = Math.max(r.x, Math.min(b.x, r.x + r.w));
        var cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
        var dx = b.x - cx;
        var dy = b.y - cy;
        var d2 = dx * dx + dy * dy;
        if (d2 >= R * R) {
            return;
        }

        var nx, ny, pen;
        if (d2 > 0.0001) {
            var d = Math.sqrt(d2);
            nx = dx / d;
            ny = dy / d;
            pen = R - d;
        } else {
            var l = b.x - r.x, rr = r.x + r.w - b.x, t = b.y - r.y, bt = r.y + r.h - b.y;
            var m = Math.min(l, rr, t, bt);
            if (m === l) { nx = -1; ny = 0; pen = l + R; }
            else if (m === rr) { nx = 1; ny = 0; pen = rr + R; }
            else if (m === t) { nx = 0; ny = -1; pen = t + R; }
            else { nx = 0; ny = 1; pen = bt + R; }
        }

        b.x += nx * pen;
        b.y += ny * pen;
        var vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
            b.vx -= (1 + e) * vn * nx;
            b.vy -= (1 + e) * vn * ny;
        }
    },

    /**
     * Avança a bola k "quadros de 60 Hz".
     * Retorna: 0 = rolando, 1 = água, 2 = no buraco, 3 = parou
     */
    _stepBall: function(b, k, t, hd) {
        var c = this.cur;
        var R = this.BALL_R;
        var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        var n = Math.ceil(sp * k / 4);
        if (n < 1) { n = 1; }
        if (n > 16) { n = 16; }
        var sd = k / n;
        var i, j;

        for (var s = 0; s < n; s++) {
            b.x += b.vx * sd;
            b.y += b.vy * sd;

            for (i = 0; i < c.walls.length; i++) {
                this._collideRect(b, c.walls[i], 0.78);
            }
            for (i = 0; i < c.movers.length; i++) {
                this._collideRect(b, this._rectAt(c.movers[i], t), 0.9);
            }

            // Bumpers
            for (i = 0; i < c.bumpers.length; i++) {
                var bm = c.bumpers[i];
                var dx = b.x - bm.x, dy = b.y - bm.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                var minD = bm.r + R;
                if (dist < minD && dist > 0.001) {
                    var nx = dx / dist, ny = dy / dist;
                    b.x = bm.x + nx * minD;
                    b.y = bm.y + ny * minD;
                    var vn = b.vx * nx + b.vy * ny;
                    if (vn < 0) {
                        b.vx -= 2.15 * vn * nx;
                        b.vy -= 2.15 * vn * ny;
                    }
                    if (b.real) { bm.flash = 0.18; }
                }
            }

            // Aceleradores
            for (i = 0; i < c.boosts.length; i++) {
                var bo = c.boosts[i];
                if (b.x > bo.x && b.x < bo.x + bo.w && b.y > bo.y && b.y < bo.y + bo.h) {
                    b.vx += bo.dx * 0.3 * sd;
                    b.vy += bo.dy * 0.3 * sd;
                }
            }

            // Portais
            var inPortal = -1;
            for (i = 0; i < c.portals.length; i++) {
                var pr = c.portals[i];
                for (j = 0; j < 2; j++) {
                    var pt = j === 0 ? pr.a : pr.b;
                    var ddx = b.x - pt.x, ddy = b.y - pt.y;
                    if (ddx * ddx + ddy * ddy < 22 * 22) {
                        inPortal = i * 2 + j;
                    }
                }
            }
            if (inPortal >= 0 && inPortal !== b.pin) {
                var pair = c.portals[inPortal >> 1];
                var dest = (inPortal & 1) === 0 ? pair.b : pair.a;
                b.x = dest.x;
                b.y = dest.y;
                b.pin = inPortal ^ 1;
            } else if (inPortal < 0) {
                b.pin = -1;
            }

            // Água
            if (this._inRect(b.x, b.y, c.water)) {
                return 1;
            }

            // Buraco
            var hx = b.x - hd.x, hy = b.y - hd.y;
            var hdist = Math.sqrt(hx * hx + hy * hy);
            var spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
            if (spd < 6.5) {
                if (hdist < hd.radius) {
                    b.x = hd.x;
                    b.y = hd.y;
                    return 2;
                }
                if (hdist < hd.radius * 1.8 && hdist > 0.001) {
                    b.vx -= (hx / hdist) * 0.06 * sd;
                    b.vy -= (hy / hdist) * 0.06 * sd;
                }
            }
        }

        // Atrito (areia freia mais)
        var base = this._inRect(b.x, b.y, c.sand) ? 0.93 : 0.982;
        var f = (k === 1) ? base : Math.pow(base, k);
        b.vx *= f;
        b.vy *= f;

        if (b.vx * b.vx + b.vy * b.vy < 0.04) {
            return 3;
        }
        return 0;
    },

    /* ------------------------------------------------------------ */
    /* Bots: simulam várias tacadas e escolhem a melhor             */
    /* ------------------------------------------------------------ */

    _simulate: function(x, y, angle, power, t0) {
        var b = { x: x, y: y, vx: Math.cos(angle) * power * this.MAX_SPEED,
                  vy: Math.sin(angle) * power * this.MAX_SPEED, pin: -1 };
        var t = t0;
        var st = 0;
        var steps = 0;
        while (steps < 900) {
            st = this._stepBall(b, 1, t, this.cur.hole);
            t += 1 / 60;
            steps++;
            if (st !== 0) {
                break;
            }
        }
        var hx = b.x - this.cur.hole.x, hy = b.y - this.cur.hole.y;
        var dist = Math.sqrt(hx * hx + hy * hy);
        if (st === 2) {
            return -1000 + steps * 0.05;
        }
        if (st === 1) {
            return dist + 350;
        }
        return dist;
    },

    _updateBot: function(p, dt) {
        var b = p.bot;
        var h = this.cur.hole;
        var i;

        if (!b) {
            b = p.bot = { stage: "think", cands: [], i: 0, best: null, bestScore: 1e9, ta: 0, tp: 0 };
            var base = Math.atan2(h.y - p.y, h.x - p.x);
            var powers = [0.4, 0.62, 0.82, 1.0];
            var angs = [];
            for (i = 0; i < 36; i++) { angs.push(i * Math.PI / 18); }
            for (i = -3; i <= 3; i++) { angs.push(base + i * 0.1); }
            for (var a = 0; a < angs.length; a++) {
                for (var q = 0; q < powers.length; q++) {
                    b.cands.push({ a: angs[a], p: powers[q] });
                }
            }
        }

        if (b.stage === "think") {
            for (var n = 0; n < 4 && b.i < b.cands.length; n++, b.i++) {
                var c = b.cands[b.i];
                var sc = this._simulate(p.x, p.y, c.a, c.p, this.time + 1.2);
                if (sc < b.bestScore) {
                    b.bestScore = sc;
                    b.best = c;
                }
            }
            if (b.i >= b.cands.length) {
                b.ta = b.best.a + (Math.random() - 0.5) * 0.08;
                b.tp = Math.min(100, b.best.p * 100 * (0.96 + Math.random() * 0.08));
                p.angle = b.ta;
                b.stage = "charge";
                p.isCharging = true;
                p.power = 0;
            }
        } else {
            p.power += 110 * dt;
            if (p.power >= b.tp) {
                this._shoot(p, b.ta, b.tp);
            }
        }
    },

    /* ------------------------------------------------------------ */
    /* Resumo, fim de jogo e utilidades                             */
    /* ------------------------------------------------------------ */

    _updateHoleSummary: function(dt, inputs) {
        this.stateTimer -= dt;
        if (this.stateTimer <= 0 || this._anyButtonAPressed(inputs)) {
            if (this.currentHole + 1 < this.TOTAL_HOLES) {
                this._enterHole(this.currentHole + 1);
            } else {
                this.state = "GAME_OVER";
            }
        }
    },

    _updateGameOver: function(dt, inputs) {
        if (this._anyButtonAPressed(inputs)) {
            this.resetMatch();
        }
    },

    _scoreLabel: function(strokes, par, failed) {
        if (failed) { return "X"; }
        if (strokes === 1) { return "Hole in one"; }
        var d = strokes - par;
        if (d <= -3) { return "Albatroz"; }
        if (d === -2) { return "Eagle"; }
        if (d === -1) { return "Birdie"; }
        if (d === 0) { return "Par"; }
        if (d === 1) { return "Bogey"; }
        if (d === 2) { return "Duplo bogey"; }
        return "+" + d;
    },

    _anyButtonAPressed: function(inputs) {
        for (var i = 0; i < this.playersList.length; i++) {
            var pl = this.playersList[i];
            if (pl.isBot) { continue; }
            var curr = inputs[pl.id];
            var prev = this.prevInputs[pl.id];
            if (curr && curr.a === 1 && (!prev || prev.a === 0)) {
                return true;
            }
        }
        return false;
    },

    _savePreviousInputs: function(inputs) {
        for (var i = 0; i < this.playersList.length; i++) {
            var id = this.playersList[i].id;
            var curr = inputs[id];
            if (curr) {
                this.prevInputs[id].x = curr.x || 0;
                this.prevInputs[id].y = curr.y || 0;
                this.prevInputs[id].a = curr.a || 0;
                this.prevInputs[id].b = curr.b || 0;
            }
        }
    },

    _trunc: function(s, n) {
        s = String(s);
        return s.length > n ? s.substring(0, n - 1) + "." : s;
    },

    /* ------------------------------------------------------------ */
    /* Renderização                                                 */
    /* ------------------------------------------------------------ */

    render: function(ctx) {
        var context = ctx || this.ctx;
        if (!context) {
            return;
        }

        context.fillStyle = "#12351f";
        context.fillRect(0, 0, this.WIDTH, this.HEIGHT);
        context.textBaseline = "alphabetic";

        if (this.state === "START") {
            this._renderStartScreen(context);
        } else if (this.state === "HOLE_INTRO") {
            this._renderCourse(context);
            this._renderIntro(context);
        } else if (this.state === "PLAYING") {
            this._renderCourse(context);
        } else if (this.state === "HOLE_SUMMARY") {
            this._renderCourse(context);
            this._renderHoleSummaryScreen(context);
        } else if (this.state === "GAME_OVER") {
            this._renderGameOverScreen(context);
        }
    },

    _renderCourse: function(ctx) {
        var c = this.cur;
        if (!c) { return; }
        var b = c.bounds;
        var i, r;

        // Moldura e gramado
        ctx.fillStyle = "#7a5230";
        ctx.fillRect(b.x - 20, b.y - 20, b.w + 40, b.h + 40);
        ctx.fillStyle = "#2d6a4f";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = "rgba(255,255,255,0.04)";
        for (var sx = b.x; sx < b.x + b.w; sx += 80) {
            ctx.fillRect(sx, b.y, 40, b.h);
        }

        // Areia
        for (i = 0; i < c.sand.length; i++) {
            r = c.sand[i];
            ctx.fillStyle = "#d9b779";
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = "#b8955a";
            ctx.lineWidth = 3;
            ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
        }

        // Água
        for (i = 0; i < c.water.length; i++) {
            r = c.water[i];
            ctx.fillStyle = "#0a74b8";
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = "rgba(255,255,255,0.35)";
            ctx.lineWidth = 2;
            for (var wy = r.y + 14; wy < r.y + r.h - 4; wy += 22) {
                ctx.beginPath();
                var off = Math.sin(this.time * 2 + wy * 0.1) * 6;
                ctx.moveTo(r.x + 10, wy);
                ctx.quadraticCurveTo(r.x + r.w / 2, wy + off, r.x + r.w - 10, wy);
                ctx.stroke();
            }
        }

        // Aceleradores
        for (i = 0; i < c.boosts.length; i++) {
            r = c.boosts[i];
            ctx.fillStyle = "rgba(0,180,216,0.35)";
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = "#caf0f8";
            ctx.lineWidth = 4;
            var phase = (this.time * 40) % 40;
            for (var ax = r.x + phase - 20; ax < r.x + r.w - 14; ax += 40) {
                if (ax < r.x) { continue; }
                ctx.beginPath();
                ctx.moveTo(ax, r.y + r.h / 2 - 14);
                ctx.lineTo(ax + 14, r.y + r.h / 2);
                ctx.lineTo(ax, r.y + r.h / 2 + 14);
                ctx.stroke();
            }
        }

        // Portais
        for (i = 0; i < c.portals.length; i++) {
            var pr = c.portals[i];
            for (var j = 0; j < 2; j++) {
                var pt = j === 0 ? pr.a : pr.b;
                ctx.fillStyle = "#0b090a";
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = pr.c;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 22, 0, Math.PI * 2);
                ctx.stroke();
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 12 + Math.sin(this.time * 4 + i) * 3, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // Tee
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        ctx.lineWidth = 2;
        if (ctx.setLineDash) { ctx.setLineDash([4, 4]); }
        ctx.beginPath();
        ctx.arc(c.tee.x, c.tee.y, 36, 0, Math.PI * 2);
        ctx.stroke();
        if (ctx.setLineDash) { ctx.setLineDash([]); }

        // Buraco + bandeira
        var h = c.hole;
        ctx.fillStyle = "#0b090a";
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeStyle = "#eeeeee";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(h.x, h.y);
        ctx.lineTo(h.x, h.y - 52);
        ctx.stroke();
        ctx.fillStyle = "#e5333a";
        ctx.beginPath();
        ctx.moveTo(h.x, h.y - 52);
        ctx.lineTo(h.x + 24, h.y - 43);
        ctx.lineTo(h.x, h.y - 34);
        ctx.fill();

        // Bumpers
        for (i = 0; i < c.bumpers.length; i++) {
            var bp = c.bumpers[i];
            var fl = bp.flash > 0;
            ctx.fillStyle = fl ? "#fff3b0" : "#fb8500";
            ctx.beginPath();
            ctx.arc(bp.x, bp.y, bp.r + (fl ? 3 : 0), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = fl ? "#ffd60a" : "#ffb703";
            ctx.beginPath();
            ctx.arc(bp.x, bp.y, bp.r * 0.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(bp.x, bp.y, bp.r, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Paredes internas
        for (i = 0; i < c.innerWalls.length; i++) {
            r = c.innerWalls[i];
            ctx.fillStyle = "#8d99ae";
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = "#edf2f4";
            ctx.lineWidth = 2;
            ctx.strokeRect(r.x, r.y, r.w, r.h);
        }

        // Obstáculos móveis
        for (i = 0; i < c.movers.length; i++) {
            r = this._rectAt(c.movers[i], this.time);
            ctx.fillStyle = "#e76f51";
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = "#ffd6c9";
            ctx.lineWidth = 2;
            ctx.strokeRect(r.x, r.y, r.w, r.h);
        }

        // Bolas (as dos outros jogadores ficam translúcidas)
        var cur = (this.state === "PLAYING") ? this.current : null;
        var p, k;
        for (k = 0; k < this.playersList.length; k++) {
            p = this.playersList[k];
            if (p.inHole || p === cur) { continue; }
            ctx.globalAlpha = 0.6;
            this._drawBall(ctx, p.x, p.y, p.color);
            ctx.globalAlpha = 1;
        }
        if (cur && !cur.inHole) {
            this._drawAim(ctx, cur);
            this._drawBall(ctx, cur.x, cur.y, cur.color);
            if (this.phase === "AIM") {
                var pulse = 16 + Math.sin(this.time * 6) * 3;
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cur.x, cur.y, pulse, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        this._renderHud(ctx, cur);

        // Mensagem de evento
        if (this.msgTimer > 0 && this.state === "PLAYING") {
            ctx.textAlign = "center";
            ctx.font = "bold 40px Arial, sans-serif";
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillText(this.msg, this.WIDTH / 2 + 2, 172);
            ctx.fillStyle = this.msgColor;
            ctx.fillText(this.msg, this.WIDTH / 2, 170);
        }
    },

    _drawBall: function(ctx, x, y, color) {
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.arc(x + 2, y + 3, this.BALL_R, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, this.BALL_R, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
    },

    _drawAim: function(ctx, p) {
        if (p.isMoving || this.phase !== "AIM") { return; }
        var len = 55 + p.power * 1.4;
        var ex = p.x + Math.cos(p.angle) * len;
        var ey = p.y + Math.sin(p.angle) * len;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3;
        if (ctx.setLineDash) { ctx.setLineDash([8, 6]); }
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(p.angle) * 14, p.y + Math.sin(p.angle) * 14);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        if (ctx.setLineDash) { ctx.setLineDash([]); }
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(ex + Math.cos(p.angle) * 10, ey + Math.sin(p.angle) * 10);
        ctx.lineTo(ex + Math.cos(p.angle + 2.5) * 10, ey + Math.sin(p.angle + 2.5) * 10);
        ctx.lineTo(ex + Math.cos(p.angle - 2.5) * 10, ey + Math.sin(p.angle - 2.5) * 10);
        ctx.fill();
    },

    _renderHud: function(ctx, cur) {
        var c = this.cur;
        var i, p;

        // Placar superior
        var n = this.playersList.length;
        var cw = n > 0 ? Math.min(155, Math.floor(1240 / n) - 5) : 150;
        var total = n * (cw + 5) - 5;
        var x0 = Math.floor((this.WIDTH - total) / 2);
        for (i = 0; i < n; i++) {
            p = this.playersList[i];
            var x = x0 + i * (cw + 5);
            ctx.fillStyle = "rgba(0,0,0,0.55)";
            ctx.fillRect(x, 12, cw, 50);
            if (cur === p) {
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.strokeRect(x, 12, cw, 50);
            }
            ctx.fillStyle = p.color;
            ctx.fillRect(x, 12, 8, 50);
            ctx.textAlign = "left";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px Arial, sans-serif";
            ctx.fillText(this._trunc(p.name, cw > 120 ? 11 : 8), x + 16, 33);
            ctx.font = "15px Arial, sans-serif";
            ctx.fillStyle = p.inHole ? "#a5d6a7" : "#cfd8dc";
            ctx.fillText((p.inHole ? "no buraco" : "jogando"), x + 16, 53);
            ctx.textAlign = "right";
            ctx.font = "bold 26px Arial, sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.fillText(String(p.totalStrokes + p.holeStrokes), x + cw - 8, 44);
        }

        // Linha de informação do buraco
        ctx.textAlign = "center";
        ctx.font = "bold 20px Arial, sans-serif";
        ctx.fillStyle = "#e8f5e9";
        ctx.fillText("BURACO " + (this.currentHole + 1) + "/" + this.TOTAL_HOLES + "  -  " + c.name + "  -  PAR " + c.par, this.WIDTH / 2, 92);

        // Rodapé: vez, barra de força, tacadas
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 646, this.WIDTH, 74);

        if (cur) {
            ctx.textAlign = "left";
            ctx.font = "bold 26px Arial, sans-serif";
            ctx.fillStyle = cur.color;
            ctx.fillText("Vez de " + this._trunc(cur.name, 14), 40, 678);

            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "22px Arial, sans-serif";
            ctx.fillText("Tacadas: " + cur.holeStrokes + "   Par: " + c.par, 1240, 678);

            // Barra de força
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.fillRect(380, 658, 520, 26);
            var pw = cur.power;
            ctx.fillStyle = pw < 50 ? "#4caf50" : (pw < 80 ? "#ffeb3b" : "#f44336");
            ctx.fillRect(380, 658, 520 * pw / 100, 26);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(380, 658, 520, 26);

            ctx.textAlign = "center";
            ctx.font = "16px Arial, sans-serif";
            ctx.fillStyle = "#cfd8dc";
            var hint = "Direcional: mirar  |  Segurar A: força  |  Soltar A: tacada  |  B: cancelar";
            if (cur.isBot) { hint = "Bot pensando na tacada..."; }
            if (this.phase === "ROLL") { hint = "Bola em movimento..."; }
            if (this.phase === "AIM" && !cur.isBot && this.idle > this.TURN_IDLE - 10) {
                hint = "Tacada automática em " + Math.ceil(this.TURN_IDLE - this.idle) + "s";
            }
            ctx.fillText(hint, this.WIDTH / 2, 710);
        }
    },

    _renderIntro: function(ctx) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(300, 250, 680, 220);
        ctx.strokeStyle = "#4caf50";
        ctx.lineWidth = 4;
        ctx.strokeRect(300, 250, 680, 220);

        ctx.textAlign = "center";
        ctx.fillStyle = "#a5d6a7";
        ctx.font = "bold 28px Arial, sans-serif";
        ctx.fillText("BURACO " + (this.currentHole + 1) + " DE " + this.TOTAL_HOLES, this.WIDTH / 2, 308);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 52px Arial, sans-serif";
        ctx.fillText(this.cur.name, this.WIDTH / 2, 376);
        ctx.fillStyle = "#ffeb3b";
        ctx.font = "bold 30px Arial, sans-serif";
        ctx.fillText("PAR " + this.cur.par, this.WIDTH / 2, 424);
        ctx.fillStyle = "#cfd8dc";
        ctx.font = "18px Arial, sans-serif";
        ctx.fillText("Primeiro a jogar: " + this._trunc(this.order[0] ? this.order[0].name : "-", 16), this.WIDTH / 2, 455);
    },

    _renderHoleSummaryScreen: function(ctx) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
        ctx.fillRect(220, 110, 840, 500);
        ctx.strokeStyle = "#4caf50";
        ctx.lineWidth = 4;
        ctx.strokeRect(220, 110, 840, 500);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 38px Arial, sans-serif";
        ctx.fillText("FIM DO BURACO " + (this.currentHole + 1) + "  (PAR " + this.cur.par + ")", this.WIDTH / 2, 165);

        var sorted = this.playersList.slice().sort(function(a, b) {
            return a.totalStrokes - b.totalStrokes;
        });
        var rowH = Math.min(46, Math.floor(340 / Math.max(1, sorted.length)));
        var y = 215;
        ctx.font = "bold 18px Arial, sans-serif";
        ctx.fillStyle = "#90a4ae";
        ctx.textAlign = "right";
        ctx.fillText("Buraco", 760, y);
        ctx.fillText("Resultado", 900, y);
        ctx.fillText("Total", 1030, y);
        y += 14;

        for (var i = 0; i < sorted.length; i++) {
            var p = sorted[i];
            y += rowH;
            var hs = p.scores[this.currentHole];
            var failed = p.fails[this.currentHole];
            ctx.fillStyle = p.color;
            ctx.fillRect(250, y - 22, 12, 22);
            ctx.textAlign = "left";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px Arial, sans-serif";
            ctx.fillText(this._trunc(p.name, 14), 274, y - 2);
            ctx.textAlign = "right";
            ctx.fillText(failed ? "X" : String(hs), 760, y - 2);
            ctx.fillStyle = "#ffeb3b";
            ctx.font = "20px Arial, sans-serif";
            ctx.fillText(this._scoreLabel(hs, this.cur.par, failed), 900, y - 2);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px Arial, sans-serif";
            ctx.fillText(String(p.totalStrokes), 1030, y - 2);
        }

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffeb3b";
        ctx.font = "bold 22px Arial, sans-serif";
        var last = this.currentHole + 1 >= this.TOTAL_HOLES;
        ctx.fillText("[A] para " + (last ? "ver o placar final" : "o próximo buraco"), this.WIDTH / 2, 585);
    },

    _renderGameOverScreen: function(ctx) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(90, 50, 1100, 620);
        ctx.strokeStyle = "#ff9800";
        ctx.lineWidth = 4;
        ctx.strokeRect(90, 50, 1100, 620);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 44px Arial, sans-serif";
        ctx.fillText("PLACAR FINAL", this.WIDTH / 2, 112);

        var sorted = this.playersList.slice().sort(function(a, b) {
            return a.totalStrokes - b.totalStrokes;
        });

        var nh = this.TOTAL_HOLES;
        var colW = 62;
        var gx = 560;
        var rowH = Math.min(46, Math.floor(400 / Math.max(1, sorted.length)));
        var y = 165;

        ctx.font = "bold 18px Arial, sans-serif";
        ctx.fillStyle = "#90a4ae";
        ctx.textAlign = "center";
        for (var h = 0; h < nh; h++) {
            ctx.fillText(String(h + 1), gx + h * colW + colW / 2, y);
        }
        ctx.fillText("Total", gx + nh * colW + 50, y);
        y += 10;

        var prevTotal = -1;
        var rank = 0;
        for (var i = 0; i < sorted.length; i++) {
            var p = sorted[i];
            if (p.totalStrokes !== prevTotal) { rank = i + 1; prevTotal = p.totalStrokes; }
            y += rowH;
            var win = rank === 1;
            if (win) {
                ctx.fillStyle = "rgba(255,215,0,0.12)";
                ctx.fillRect(110, y - rowH + 8, 1060, rowH);
            }
            ctx.textAlign = "left";
            ctx.fillStyle = win ? "#ffd700" : "#ffffff";
            ctx.font = "bold 24px Arial, sans-serif";
            ctx.fillText(rank + "º", 130, y - 6);
            ctx.fillStyle = p.color;
            ctx.fillRect(190, y - 24, 12, 22);
            ctx.fillStyle = win ? "#ffd700" : "#ffffff";
            ctx.fillText(this._trunc(p.name, 14), 214, y - 6);
            if (win) {
                ctx.font = "bold 14px Arial, sans-serif";
                ctx.fillText("VENCEDOR", 420, y - 8);
            }
            ctx.textAlign = "center";
            ctx.font = "20px Arial, sans-serif";
            ctx.fillStyle = "#e0e0e0";
            for (var k = 0; k < nh; k++) {
                var v = p.scores[k];
                ctx.fillText(v === undefined ? "-" : (p.fails[k] ? "X" : String(v)), gx + k * colW + colW / 2, y - 6);
            }
            ctx.font = "bold 26px Arial, sans-serif";
            ctx.fillStyle = win ? "#ffd700" : "#ffffff";
            ctx.fillText(String(p.totalStrokes), gx + nh * colW + 50, y - 6);
        }

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffeb3b";
        ctx.font = "bold 26px Arial, sans-serif";
        ctx.fillText("Pressione [A] para jogar novamente", this.WIDTH / 2, 640);
    },

    _renderStartScreen: function(ctx) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(140, 100, 1000, 520);

        ctx.strokeStyle = "#4caf50";
        ctx.lineWidth = 4;
        ctx.strokeRect(140, 100, 1000, 520);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 56px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("MINI GOLF PARTY", this.WIDTH / 2, 190);

        ctx.fillStyle = "#a5d6a7";
        ctx.font = "28px Arial, sans-serif";
        ctx.fillText(this.holesData.length + " pistas, uma tacada de cada vez. Menos tacadas vence!", this.WIDTH / 2, 245);

        ctx.fillStyle = "#ffffff";
        ctx.font = "24px Arial, sans-serif";
        ctx.fillText("Direcional: Mirar  |  Segurar (A): Força  |  Soltar (A): Tacada  |  (B): Cancelar", this.WIDTH / 2, 295);

        ctx.font = "bold 24px Arial, sans-serif";
        ctx.fillText("Jogadores (" + this.playersList.length + "):", this.WIDTH / 2, 355);

        var startX = 240;
        var spacing = 200;
        for (var i = 0; i < this.playersList.length; i++) {
            var p = this.playersList[i];
            var col = i % 4;
            var row = Math.floor(i / 4);
            var px = startX + (col * spacing) + 100;
            var py = 405 + (row * 50);

            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(px - 60, py - 8, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "left";
            ctx.font = "22px Arial, sans-serif";
            ctx.fillText(this._trunc(p.name, 11), px - 40, py);
        }

        ctx.fillStyle = "#cfd8dc";

<script type="text/plain" id="k_dance">/* ===== DANCE LAB — Fase 1: protótipo de sensores (controle web) =====

var DanceCore = (function () {

  var C = {

    GTAU: 300,      // constante do filtro de gravidade quando não há acel. linear
    MINDUR: 50,     // duração mínima do pico, ms (descarta "agulhadas")
    MAXDUR: 320,    // duração máxima do pico, ms
    MINIMP: 0.05,   // impulso mínimo = MINIMP × limiar (área do pico, m/s)
    MINABOVE: 2,    // amostras mínimas acima do limiar (descarta pico de 1 amostra)

    function thr() {

          if (aV > Math.abs(st.pV)) st.pV = V;

    } else {                                                     // Android/Chrome: sem diálogo
      authOK = true;
      authTxt = 'Este navegador não pede permissão por diálogo. Se não chegarem dados, libere “Sensores de movimento” nas configurações do site.';
      cb(true);
    }
  }

  /* ---- leitura ---- */
  function num(o, a, b, c) {
    return (o && o[a] != null && o[b] != null && o[c] != null) ? [o[a], o[b], o[c]] : null;
  }
  function onMotion(e) {
    var now = performance.now();
    var lin = num(e.acceleration, 'x', 'y', 'z');
    var aig = num(e.accelerationIncludingGravity, 'x', 'y', 'z');
    var rot = num(e.rotationRate, 'beta', 'gamma', 'alpha');
    if (!lin && !aig && !rot) { emptyEv++; return; }
    nEv++; hzN++;
    if (now - hzT >= 1000) { hz = Math.round(hzN * 1000 / (now - hzT)); hzN = 0; hzT = now; }
    cur.lin = lin; cur.aig = aig; cur.rot = rot;
    srcMode = lin ? 'acel. linear do sistema' : (aig ? 'filtro passa-alta (sem acel. linear)' : 'só giroscópio');
    var out = det.feed(now, aig, lin, rot);
    lastOut = out;
    if (calib) {
      if (out.lin || rot) calib.add(rot, out.lin);
      if (now >= calibEnd) finishCalib();
    }
    if (out.ev) onEvent(out.ev);
  }
  function onOri(e) { ori = [e.alpha, e.beta, e.gamma]; }

  function onEvent(ev) {
    var d = new Date(), ts = ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2) + '.' + ('00' + d.getMilliseconds()).slice(-3);
    log.unshift(ts + '  ' + ICONS[ev.m] + ' ' + NAMES[ev.m] + '  ' + ev.s + (ev.m === 'spin' ? '° eixo ' + ev.ax + (ev.sg > 0 ? '+' : '-') : ' m/s²'));
    if (log.length > 6) log.length = 6;
    if (el) {
      $('dz-big').style.background = COLS[ev.m];
      $('dz-big').style.color = '#111';
      $('dz-bigt').textContent = ICONS[ev.m] + ' ' + NAMES[ev.m];
      $('dz-bigs').textContent = 'força ' + ev.s + (ev.m === 'spin' ? '°' : ' m/s²');
      clearTimeout(tBig);
      tBig = setTimeout(function () {
        $('dz-big').style.background = '#1b2140'; $('dz-big').style.color = '#fff';
      }, 600);
    }
    if (tvSend && tvOk()) sendTv({ t: 'dance', k: 'ev', m: ev.m, s: ev.s, n: ++seq, ts: Date.now() });
  }

  /* ---- TV (canal PeerJS existente: window.conn / window.joined) ---- */
  function tvOk() { return !!(window.conn && window.conn.open && window.joined); }
  function sendTv(msg) { try { window.conn.send(msg); nSent++; } catch (e) {} }
  function hookPong() {
    var c = window.conn;
    if (!c || c === pongConn || !c.on) return;
    pongConn = c;
    c.on('data', function (d) {
      if (d && d.t === 'dance' && d.k === 'pong' && typeof d.c === 'number') rtt = Date.now() - d.c;
    });
  }
  function pingTick() {
    if (tvOk()) { hookPong(); sendTv({ t: 'dance', k: 'ping', c: Date.now() }); } else { rtt = null; }
  }
  function r1(x) { return Math.round(x * 100) / 100; }
  function uiTick() {
    render();
    if (running && tvSend && tvOk() && (cur.lin || cur.aig)) {
      var l = cur.lin || cur.aig, g = cur.rot || [0, 0, 0], o = ori || [0, 0, 0];
      sendTv({
        t: 'dance', k: 'tel', a: [r1(l[0]), r1(l[1]), r1(l[2])], g: [Math.round(g[0]), Math.round(g[1]), Math.round(g[2])],
        o: [Math.round(o[0] || 0), Math.round(o[1] || 0), Math.round(o[2] || 0)],
        h: r1(lastOut ? lastOut.h : 0), v: r1(lastOut ? lastOut.v : 0), hz: hz, ts: Date.now()
      });
    }
  }

  /* ---- ações ---- */
  function start() {
    if (running) return;
    authorize(function (ok) {
      if (!ok) { render(); return; }
      det.reset(); nEv = 0; emptyEv = 0; hzN = 0; hz = 0; hzT = performance.now(); warn = ''; lastOut = null;
      window.addEventListener('devicemotion', onMotion, false);
      window.addEventListener('deviceorientation', onOri, false);
      running = true;
      clearTimeout(tWatch);
      tWatch = setTimeout(function () {
        if (!running) return;
        if (nEv === 0 && emptyEv === 0) warn = 'Nenhum evento de sensor recebido. Confira: página em HTTPS; Chrome › ⋮ › Configurações › Configurações do site › Sensores de movimento › Permitir; modo economia de bateria.';
        else if (nEv === 0) warn = 'O navegador enviou eventos vazios (sem acelerômetro/giroscópio acessível — comum no desktop ou com a permissão bloqueada).';
        render();
      }, 1500);
      render();
    });
  }
  function stop() {
    if (!running) return;
    window.removeEventListener('devicemotion', onMotion, false);
    window.removeEventListener('deviceorientation', onOri, false);
    running = false; calib = null; clearTimeout(tWatch); warn = '';
    render();
  }
  function calibrate() {
    if (!running) { calibTxt = 'Inicie a leitura antes de calibrar.'; render(); return; }
    calib = det.calibrator(); calibEnd = performance.now() + 2000; calibTxt = 'Calibrando… segure o celular parado por 2 s.';
    render();
  }
  function finishCalib() {
    var r = calib.finish(); calib = null;
    if (r.ok) det.setCalib(r);
    calibTxt = r.msg; render();
  }

  function open() {
    if (!el) { cfgLoad(); build(); }
    el.style.display = 'block'; isOpen = true;
    clearInterval(tUi); clearInterval(tPing);
    tUi = setInterval(uiTick, 100); tPing = setInterval(pingTick, 2000);
    pingTick(); queryPerms(function () { render(); }); render();
  }
  function close() {
    stop(); isOpen = false;
    clearInterval(tUi); clearInterval(tPing);
    if (el) el.style.display = 'none';
  }
  function toggle() { isOpen ? close() : open(); }

  /* ---- render ---- */
  function p(v, w, d) {
    if (v == null) return ('n/d').slice(0, w);
    var s = (v >= 0 ? '+' : '') + v.toFixed(d); while (s.length < w) s = ' ' + s; return s;
  }
  function row(label, a, d, nm) {
    nm = nm || 'xyz';
    return (label + '                ').slice(0, 16) + (a ? nm.charAt(0) + p(a[0], 7, d) + ' ' + nm.charAt(1) + p(a[1], 7, d) + ' ' + nm.charAt(2) + p(a[2], 7, d) : 'indisponível');
  }
  function render() {
    if (!el || !isOpen) return;
    var st = det.stats();
    var secure = window.isSecureContext !== false;
    var tv = tvOk() ? ('✔ ligada' + (rtt != null ? ' · ' + rtt + ' ms' : '') + (tvSend ? '' : ' (envio desligado)')) : '✘ entre na sala para enviar';
    var h = 'HTTPS: ' + (secure ? '✔' : '<span class="dzw">✘ (sensores podem ser bloqueados)</span>') +
      ' · Leitura: ' + (running ? (nEv ? '✔ ' + hz + ' Hz' : 'aguardando…') : 'parada') + '<br>' +
      'TV: ' + tv + '<br>' + (permTxt ? 'Permissão do site: ' + permTxt + '<br>' : '') +
      (authTxt ? authTxt + '<br>' : '') + (calibTxt ? calibTxt + '<br>' : '') +
      (warn ? '<span class="dzw">' + warn + '</span>' : '');
    $('dz-st').innerHTML = h;
    $('dz-run').textContent = running ? '■ PARAR' : '▶ INICIAR';
    $('dz-run').className = running ? 'r' : '';
    $('dz-tv').textContent = '📡 Enviar p/ TV: ' + (tvSend ? 'SIM' : 'NÃO');
    $('dz-flip').textContent = '⇄ Inverter esq/dir: ' + (det.cfg.flip ? 'SIM' : 'NÃO');
    $('dz-sv').textContent = det.cfg.sens;
    var o = lastOut;
    $('dz-vals').textContent =
      row('ACEL linear', cur.lin, 2) + '\n' + row('ACEL c/ grav.', cur.aig, 2) + '\n' +
      row('GIRO °/s', cur.rot, 0, 'bga') + '\n' + row('ORIENT °', ori ? [ori[0] || 0, ori[1] || 0, ori[2] || 0] : null, 0, 'abg') + '\n' +
      'Esq/Dir (H): ' + p(o ? o.h : 0, 6, 2) + '   Cima/Baixo (V): ' + p(o ? o.v : 0, 6, 2) + '\n' +
      'Limiar: ' + det.thr().toFixed(1) + ' m/s²   Giro: ' + (o ? Math.round(o.ang) : 0) + '°/' + Math.round(det.spinAng()) + '°\n' +
      'Modo: ' + srcMode + '\n' +
      'Eventos: ' + st.events + ' · descartados: ' + st.rejected + ' · enviados à TV: ' + nSent;
    $('dz-log').innerHTML = log.length ? log.join('<br>') : '';
  }

  return { open: open, close: close, toggle: toggle, det: det };
})();
</script>
